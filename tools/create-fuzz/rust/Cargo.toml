[package]
name = "create-fuzz"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# The port's engine, from this repository.
create-engine = { path = "../../../create/src/engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Feature unification with create-engine's `zlib-rs` selects that backend and its
# CRC in flate2 1.1.10 (src/ffi/mod.rs and src/crc.rs). The fuzzer's defaults build
# miniz_oxide but do not use it; the shipped mod's flate2 lock entry has only zlib-rs.
flate2 = "1"
